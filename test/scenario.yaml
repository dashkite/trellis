"valid spec":
  name: blog-platform
  nodes:
    author:
      description: An author of the blog.
      properties:
        id: { type: string }
        email: { type: string }
      required: [id, email]
      keys: [[email]]
    post:
      description: A blog post.
      properties:
        title: { type: string }
      required: [title]
  connectors:
    editor:
      description: Manages post editor assignments.
      properties:
        assigned: { type: string }
      required: [assigned]
      connections:
        - from: author
          to: post
          cardinality: "*..*"
          description: Links authors to their posts.

"invalid structure":
  name: invalid
  nodes:
    author:
      properties:
        id: { type: string }

"invalid node ref":
  name: blog-platform
  nodes:
    author:
      properties:
        id: { type: string }
  connectors:
    editor:
      connections:
        - from: author
          to: non-existent-node
          cardinality: "*..*"

"invalid unique key":
  name: blog-platform
  nodes:
    author:
      properties:
        id: { type: string }
      keys: [[email]]
  connectors: {}

"invalid required":
  name: blog-platform
  nodes:
    author:
      properties:
        id: { type: string }
      required: [email]
  connectors: {}

"experiment spec":
  name: blog-management
  nodes:
    blog:
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
      required: [id, name]
      keys: [[name]]
    post:
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
      required: [id, title, content]
    author:
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
      required: [id, name, email]
      keys: [[email]]
    editor:
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
      required: [id, name, email]
      keys: [[email]]
  connectors:
    has-post:
      connections:
        - from: blog
          to: post
          cardinality: "1..*"
    has-author:
      connections:
        - from: blog
          to: author
          cardinality: "*..*"
    has-editor:
      connections:
        - from: blog
          to: editor
          cardinality: "*..*"
    author-of:
      connections:
        - from: author
          to: post
          cardinality: "1..*"
    editor-of:
      connections:
        - from: editor
          to: post
          cardinality: "*..*"
