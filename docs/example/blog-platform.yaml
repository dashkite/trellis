name: blog-platform
nodes:
  author:
    properties:
      id:
        type: string
      email:
        type: string
    required:
      - id
      - email
    keys:
      - - email
  post:
    properties:
      title:
        type: string
    required:
      - title
connectors:
  editor:
    properties:
      assigned:
        type: string
    required:
      - assigned
    connections:
      - from: author
        to: post
        cardinality: "*..*"
