name: blog-platform
nodes:
  author:
    description: An author of the blog.
    properties:
      id:
        type: string
      email:
        type: string
    required:
      - id
      - email
    keys:
      - - email
  post:
    description: A blog post.
    properties:
      title:
        type: string
    required:
      - title
connectors:
  editor:
    description: Manages post editor assignments.
    properties:
      assigned:
        type: string
    required:
      - assigned
    connections:
      - from: author
        to: post
        cardinality: "*..*"
        description: Links authors to their posts.
