presets:
  - "@dashkite/genie-yaml"
  - "@dashkite/genie-schema"

coffee:
  targets:
    - node
    - browser

yaml:
  targets:
    browser:
      - preset: js
        glob: "src/**/*.yaml"
      - preset: js
        glob: "test/**/*.yaml"
    node:
      - preset: js
        glob: "src/**/*.yaml"
      - preset: js
        glob: "test/**/*.yaml"
