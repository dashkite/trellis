presets:
  - "@dashkite/genie-yaml"
  - "@dashkite/genie-schema"
  - "@dashkite/genie-pug"

coffee:
  targets:
    - node
    - browser

pug:
  targets:
    node:
      - preset: js
        glob: "src/**/*.pug"

yaml:
  targets:
    browser:
      - preset: js
        glob: "src/**/*.yaml"
      - preset: js
        glob: "test/**/*.yaml"
    node:
      - preset: js
        glob: "src/**/*.yaml"
      - preset: js
        glob: "test/**/*.yaml"
